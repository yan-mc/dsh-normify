name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build (tsc)
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (engine + companion e2e)
        run: npm test
      - name: Bundle + tool-name contract
        run: node ci-contract-check.cjs
      - name: Portability guard (no Windows-only path juggling)
        # 教训：tests 里曾用 pathname.replace(/^\//,'') 拼 file URL —— Windows 正常（/F:/…），
        # Linux 上 pathname 以 / 开头、去掉后变成相对路径，被解析成 <cwd>/home/runner/… 而 ERR_MODULE_NOT_FOUND。
        run: |
          if grep -rIn "pathname\.replace" tests/ scripts/ ; then
            echo "::error::use new URL(rel, import.meta.url).href instead of pathname.replace (POSIX-unsafe)"; exit 1
          fi
          echo "portability guard ok"

      - name: Sanity checks
        run: |
          node --check lib/index.js
          node --check lib/tools.js
          node -e "const fs=require('fs');const s=fs.readFileSync('skills/normify-gen/SKILL.md','utf8');if(!s.startsWith('---')||!/name:\s*normify-gen/.test(s))throw new Error('SKILL.md frontmatter invalid');const v=fs.readFileSync('vendor/schemastery/lib/index.mjs','utf8');if(!v.includes('../../cosmokit/lib/index.js'))throw new Error('vendor patch missing');console.log('sanity ok')"
